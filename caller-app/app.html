<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2563EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>FortX Caller</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .app-header {
      position:sticky; top:0; z-index:40;
      background:var(--surface); border-bottom:1px solid var(--border);
      padding:0.75rem 1rem; display:flex; align-items:center; justify-content:space-between;
    }
    .app-header-left { display:flex; align-items:center; gap:0.5rem; }
    .app-header-logo { font-size:var(--text-md); font-weight:700; color:var(--accent); }
    .app-header-right { display:flex; align-items:center; gap:0.5rem; }
    .app-header-name { font-size:var(--text-sm); color:var(--text-sub); }
    .switch-user-btn {
      font-size:var(--text-xs); color:var(--accent); font-weight:600;
      padding:0.3rem 0.6rem; border-radius:100px; background:var(--accent-light);
      cursor:pointer; border:none;
    }
    .switch-user-btn:active { opacity:0.7; }
    .view-container { min-height:calc(100vh - var(--nav-height)); }
  </style>
</head>
<body>
  <div class="app-header">
    <div class="app-header-left">
      <div class="app-header-logo">FortX</div>
      <div class="app-header-name" id="header-name"></div>
    </div>
    <div class="app-header-right">
      <button class="switch-user-btn" id="header-switch-btn">Switch</button>
    </div>
  </div>

  <div class="app-container">
    <div id="view-root"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" data-view="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </button>
    <button class="nav-item" data-view="leads">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      Leads
    </button>
    <button class="nav-item" data-view="earnings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      Earnings
    </button>
    <button class="nav-item" data-view="leaderboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
      Board
    </button>
    <button class="nav-item" data-view="script">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Script
    </button>
    <button class="nav-item" data-view="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Kitter
    </button>
  </nav>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/router.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/lead-card.js"></script>
  <script src="js/components/outcome-modal.js"></script>
  <script src="js/components/demo-modal.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/leads.js"></script>
  <script src="js/views/earnings.js"></script>
  <script src="js/views/leaderboard.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/views/script.js"></script>
  <script src="js/views/chat.js"></script>
  <script>
    if (!Auth.isLoggedIn()) {
      window.location.href = 'index.html';
    }

    Toast.init();

    const caller = Auth.getCaller();
    document.getElementById('header-name').textContent = caller?.name || '';

    Router.register('home', renderHome);
    Router.register('leads', renderLeads);
    Router.register('earnings', renderEarnings);
    Router.register('leaderboard', renderLeaderboard);
    Router.register('profile', renderProfile);
    Router.register('script', renderScript);
    Router.register('chat', renderChat);
    Router.init(document.getElementById('view-root'));

    const ONBOARD_KEY = `fortx_onboard_${caller?.id}`;
    if (localStorage.getItem(ONBOARD_KEY) !== 'done') {
      Router.go('chat');
    }

    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => Router.go(btn.dataset.view));
    });

    document.getElementById('header-switch-btn').addEventListener('click', () => {
      if (confirm('Switch to a different caller?')) {
        Auth.logout();
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
