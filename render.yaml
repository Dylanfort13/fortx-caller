services:
  - type: web
    name: fortx-caller-api
    runtime: python
    buildCommand: pip install -r caller-api/requirements.txt
    startCommand: uvicorn caller-api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
